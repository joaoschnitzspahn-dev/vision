<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entre em contato com a Visão Nobre. Tire suas dúvidas sobre nossos cursos profissionalizantes." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Contato | Visão Nobre" />
    <meta property="og:description" content="Fale conosco por WhatsApp, e-mail ou formulário de contato." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vision-zeta-eight.vercel.app/contato" />
    <link rel="canonical" href="https://vision-zeta-eight.vercel.app/contato" />
    <title>Contato | Visão Nobre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="siteHeader" class="site-header"></header>

    <section class="hero hero-compact">
      <div class="overlay"></div>
      <div class="container hero-content">
        <h1>Contato</h1>
        <p class="page-intro">Estamos prontos para tirar suas dúvidas e ajudar na sua inscrição.</p>
      </div>
    </section>

    <main class="section">
      <div class="container contact-grid">
        <div class="card reveal">
          <h2>Envie uma mensagem</h2>
          <form id="contatoForm" novalidate style="margin-top:20px">
            <div class="form-grid">
              <div class="input-group full">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required autocomplete="name" />
              </div>
              <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email" />
              </div>
              <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" inputmode="numeric" maxlength="15" required />
              </div>
              <div class="input-group full">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" required></textarea>
              </div>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
              <span class="btn-label">Enviar mensagem</span>
              <span class="spinner hidden"></span>
            </button>
          </form>
        </div>

        <div class="card reveal">
          <h2>Informações de contato</h2>
          <div class="contact-info-list">
            <div class="contact-info-item">
              <span class="icon" aria-hidden="true"></span>
              <div>
                <strong>WhatsApp</strong>
                <p><a id="contactWhatsapp" href="#" target="_blank" rel="noopener noreferrer"></a></p>
              </div>
            </div>
            <div class="contact-info-item">
              <span class="icon" aria-hidden="true"></span>
              <div>
                <strong>E-mail</strong>
                <p><a id="contactEmail" href="#"></a></p>
              </div>
            </div>
            <div class="contact-info-item">
              <span class="icon" aria-hidden="true"></span>
              <div>
                <strong>Endereço</strong>
                <p id="contactAddress"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="siteFooter" class="site-footer"></footer>
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/courses-data.js"></script>
    <script src="js/localdb.js"></script>
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/contato.js"></script>
  </body>
</html>
