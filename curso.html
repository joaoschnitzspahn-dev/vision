<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detalhes do curso gratuito do Projeto Social Visão Nobre." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://vision-zeta-eight.vercel.app/curso/" />
    <title>Curso | Projeto Social Visão Nobre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="topBar" class="top-bar"></div>
    <header id="siteHeader" class="site-header"></header>

    <div id="courseContent">
      <section class="course-banner">
        <div class="course-banner-bg">
          <img id="courseBannerImg" src="" alt="" loading="eager" width="1200" height="400" decoding="async" onerror="this.onerror=null;this.src='assets/cursos/placeholder.svg';" />
        </div>
        <div class="course-banner-overlay"></div>
        <div class="container course-banner-content">
          <span class="badge" id="courseFreeBadge"></span>
          <span class="badge badge-brand" id="courseAgeBadge"></span>
          <h1 id="courseTitle"></h1>
          <p id="courseSubtitle"></p>
        </div>
      </section>

      <main class="section section-light">
        <div class="container course-detail-grid">
          <div>
            <div class="content-block reveal">
              <h2>Sobre o curso</h2>
              <p id="courseDescription"></p>
            </div>
            <div class="content-block reveal">
              <h2>O que o aluno aprenderá</h2>
              <ul id="courseLearnings"></ul>
            </div>
            <div class="content-block reveal">
              <h2>Conteúdo programático</h2>
              <ul id="courseProgram"></ul>
            </div>
            <div class="content-block reveal">
              <h2>Benefícios</h2>
              <ul id="courseBenefits"></ul>
            </div>
            <div class="content-block reveal">
              <h2>Requisitos</h2>
              <ul id="courseRequirements"></ul>
            </div>
            <div class="content-block reveal">
              <h2>Mercado de trabalho</h2>
              <p id="courseMarket"></p>
            </div>
          </div>

          <aside class="sticky-form">
            <div class="card form-section reveal">
              <div class="section-header-row">
                <h2>Inscreva-se</h2>
                <span class="badge" id="courseDuration"></span>
              </div>
              <form id="inscricaoForm" novalidate>
                <div class="form-grid">
                  <div class="input-group full">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required autocomplete="name" />
                  </div>
                  <div class="input-group">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required />
                  </div>
                  <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" required />
                  </div>
                  <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" inputmode="numeric" maxlength="15" required />
                  </div>
                  <div class="input-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="text" id="whatsapp" name="whatsapp" inputmode="numeric" maxlength="15" required />
                  </div>
                  <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email" />
                  </div>
                  <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required />
                  </div>
                  <div class="input-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required></select>
                  </div>
                  <div class="input-group full">
                    <label for="curso_id">Curso desejado</label>
                    <select id="curso_id" name="curso_id" required></select>
                  </div>
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
                  <span class="btn-label">Enviar inscrição</span>
                  <span class="spinner hidden"></span>
                </button>
              </form>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <div id="courseNotFound" class="section hidden">
      <div class="container card" style="text-align:center;padding:48px 24px">
        <h1>Curso não encontrado</h1>
        <p style="margin:16px 0 24px">O curso solicitado não existe ou não está disponível.</p>
        <a href="/cursos" class="btn btn-primary">Ver todos os cursos</a>
      </div>
    </div>

    <footer id="siteFooter" class="site-footer"></footer>
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/courses-data.js"></script>
    <script src="js/localdb.js"></script>
    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/curso.js"></script>
  </body>
</html>
