<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Admin | Visão Nobre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="admin-body">
    <main class="container admin-main">
      <section id="adminLoginCard" class="card admin-login fade-in-up">
        <h1>Painel Administrativo</h1>
        <p class="subtitle">Acesso restrito para administradores</p>

        <form id="adminLoginForm" novalidate>
          <div class="input-group">
            <label for="adminEmail">E-mail</label>
            <input type="email" id="adminEmail" required />
          </div>
          <div class="input-group">
            <label for="adminPassword">Senha</label>
            <input type="password" id="adminPassword" required />
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
            <span class="btn-label">Entrar</span>
            <span class="spinner hidden"></span>
          </button>
        </form>
      </section>

      <section id="adminDashboard" class="hidden fade-in-up">
        <div class="dashboard-top">
          <div class="card stat-card">
            <span>Total de inscritos</span>
            <strong id="totalInscritos">0</strong>
          </div>
          <div class="card search-card">
            <label for="searchInput">Pesquisar por nome ou CPF</label>
            <input
              type="text"
              id="searchInput"
              placeholder="Digite nome ou CPF..."
              maxlength="80"
            />
          </div>
          <button id="logoutBtn" class="btn btn-outline">Sair</button>
        </div>

        <div class="card table-card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>CPF</th>
                  <th>Idade</th>
                  <th>Nascimento</th>
                  <th>Telefone</th>
                  <th>WhatsApp</th>
                  <th>E-mail</th>
                  <th>Cidade</th>
                  <th>Bairro</th>
                  <th>Data da inscrição</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="inscricoesTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
